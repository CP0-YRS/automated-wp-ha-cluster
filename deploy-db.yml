- name: Deployer la base de donnees MySQL
  hosts: dbservers
  become: yes

  tasks:
    - name: Mettre a jour apt
      apt:
        update_cache: yes

    - name: Installer Docker
      apt:
        name:
          - docker.io
          - docker-compose
        state: present

    - name: Demarrer Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Cree le dossier pour la BDD
      file:
        path: /opt/mysql
        state: directory

    - name: Creer le fichier docker-compose.yml pour la BDD
      copy:
        dest: /opt/mysql/docker-compose.yml
        content: |
           version: '3.8'
           services:
             db:
               image: mysql:8.0
               ports:
                 - "3306:3306"
               environment:
                 MYSQL_ROOT_PASSWORD: secret
                 MYSQL_DATABASE: wordpress
               command: --default-authentication-plugin=mysql_native_password

    - name: Lancer le conteneur MySQL
      command: docker-compose up -d
      args:
        chdir: /opt/mysql
